# STRMhub 一键部署配置
# 使用方式: 保存为 docker-compose.yml, 然后执行: docker compose up -d
# 首次使用前请修改: STRMHUB_ADMIN_PASSWORD(必改)、EMBY_HOST、EMBY_API_KEY

services:
  strmhub:
    # 直接拉取官方镜像(由 GitHub Actions 自动构建发布)
    image: ghcr.io/daisyyijin/strmhub:latest
    container_name: strmhub
    restart: always
    ports:
      - 6060:6060      # 管理页面/API(改 6060 左侧可换访问端口)
      - 6086:6086      # Emby 302 反代(Emby 客户端改连此端口)
    environment:
      # 必改: 管理台登录密码
      - STRMHUB_ADMIN_PASSWORD=change-me
      # Emby/Jellyfin 地址与 API Key(302 反代必需; 容器网络下可用 宿主机IP)
      - EMBY_HOST=http://127.0.0.1:8096
      - EMBY_API_KEY=
      # 可选: TMDB API Key, 用于刮削 https://www.themoviedb.org/settings/api
      # - TMDB_API_KEY=
      # 可选: 数据目录(默认 /app/data)
      # - STRMHUB_DATA=/app/data
    volumes:
      # 必挂: 数据持久化(密钥/数据库/凭据, 改左侧为你的宿主机目录)
      - ./data:/app/data
      # 可选: STRM 输出目录(本地驱动生成 + 反代读取)
      - ./strm:/strm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:6060/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
