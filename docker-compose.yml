services:
  strmhub:
    image: ghcr.io/daisyyijin/strmhub:latest
    container_name: strmhub
    restart: unless-stopped
    ports:
      - "6060:6060"   # 管理后台
      - "6086:6086"   # 302 直链代理
      - "6688:6688"   # 观影门户（6666 在浏览器不安全端口黑名单，不可用）
    volumes:
      - ./config:/config
      - ./data:/data
      - ./media:/media
      - ./logs:/logs
    environment:
      - TZ=Asia/Shanghai
